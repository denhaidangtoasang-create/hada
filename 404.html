<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Không tìm thấy trang – HADA</title>
<meta name="robots" content="noindex"><meta name="theme-color" content="#07060b">
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060b;--bg2:#0e0c16;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--ink:#f5f2ff;--muted:#a49fb8;--dim:#6d6882;--grad:linear-gradient(100deg,#ffb547,#ff4d6d 40%,#8b5cf6 75%,#22d3ee);--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}html{overflow-x:hidden;overflow-x:clip}
body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;display:grid;grid-template-rows:auto 1fr}
a{color:inherit;text-decoration:none}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.5}.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:46vw;height:46vw;left:8%;top:4%;background:#ff4d6d55}.aurora i:nth-child(2){width:40vw;height:40vw;right:6%;top:18%;background:#8b5cf666;animation-duration:30s}.aurora i:nth-child(3){width:36vw;height:36vw;left:34%;top:46%;background:#22d3ee33}
@keyframes drift{to{transform:translate(6vw,-5vh) scale(1.15)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 30%,transparent 80%);opacity:.5}
nav,main{position:relative;z-index:2}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left));width:100%}
nav{position:sticky;top:0;padding:12px 0}
nav .bar{display:flex;align-items:center;gap:10px;height:58px;padding:0 10px;border:1px solid var(--line);border-radius:18px;background:rgba(14,12,22,.7);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.homebtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--glass2)}.homebtn:hover{background:var(--ink);color:#0a0810}
.logo{font-weight:900;font-size:19px;display:flex;align-items:center;gap:9px}.logo b{width:28px;height:28px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:14px;color:#0a0810}
main{display:grid;place-items:center;text-align:center;padding:40px 0 60px}
.code{font-family:var(--mono);font-size:clamp(80px,20vw,180px);font-weight:500;line-height:1;letter-spacing:-.06em;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:200% 0}}
h1{font-size:clamp(24px,4vw,40px);letter-spacing:-.02em;margin:8px 0 10px;font-weight:900}
p{color:var(--muted);max-width:520px;margin:0 auto 26px}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.links a{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:14px;border:1px solid var(--line2);background:var(--glass);font-weight:700;transition:.2s}.links a:hover{border-color:var(--ink);transform:translateY(-1px)}
.links a.p{border:0;color:#0a0810;background:var(--grad)}
.hint{margin-top:30px;color:var(--dim);font-size:13px}.hint code{font-family:var(--mono);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="grid-bg" aria-hidden="true"></div>
<nav><div class="wrap"><div class="bar"><a class="homebtn" href="/" aria-label="Về trang chủ" title="Trang chủ"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg></a><a class="logo" href="/"><b>H</b>HADA</a></div></div></nav>
<main><div class="wrap">
 <div class="code">404</div>
 <h1>Trang này đi lạc rồi</h1>
 <p>Địa chỉ bạn mở không có trên hadavn.com, có thể đã đổi tên hoặc gõ nhầm. Chọn một trong các trang chính bên dưới nhé.</p>
 <div class="links">
  <a class="p" href="/">⌂ Trang chủ</a><a href="/sach/">📚 Tủ sách</a><a href="/picks/">🛒 HaDa Picks</a><a href="/ai/">🤖 HADA AI Studio</a><a href="/ai/#kho">🎁 Kho câu lệnh</a>
 </div>
 <p class="hint">Bạn vừa mở: <code id="u"></code></p>
</div></main>
<script>document.getElementById('u').textContent=location.pathname.slice(0,80);</script>
</body>
</html>
